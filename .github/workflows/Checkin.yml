name: IKUUU-Auto-Checkin

on:
  workflow_dispatch:
  schedule:
    # Actions 任务延迟过高，提前一些时间。
    # UTC+8 ~ 07:33
    - cron: "33 23 * * *"

jobs:
  checkin:
    name: Checkin
    runs-on: ubuntu-latest
    env:
      ACCOUNTS: ${{ secrets.ACCOUNTS }}
      HOST: ${{ secrets.HOST }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
      WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
      WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_SECURE: ${{ secrets.IMAP_SECURE }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
      IMAP_MAILBOX: ${{ secrets.IMAP_MAILBOX }}
      IKUUU_FIND_ADDRESS: ${{ secrets.IKUUU_FIND_ADDRESS }}
      IKUUU_DISCOVERY_TIMEOUT: ${{ secrets.IKUUU_DISCOVERY_TIMEOUT }}

    steps:
      - uses: actions/checkout@v6

      - name: Restore last host
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ikuuu-host
          key: ikuuu-host-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ikuuu-host-

      - name: Use Node.js latest
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Checkin
        id: checkin
        shell: bash
        run: |
          node main.js

      - name: Save last host
        if: always() && hashFiles('.ikuuu-host') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ikuuu-host
          key: ikuuu-host-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Notify
        if: ${{ always() && env.TELEGRAM_TOKEN && env.TELEGRAM_TO }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *iKuuu 自动签到*

            ${{ steps.checkin.outputs.result  }}

            [任务详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
